services:
  db:
    image: postgres:16-alpine
    container_name: allowance-db
    restart: always
    env_file: 
      - .env.production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    image: allowance-system-app:latest
    container_name: hms-web-app
    restart: always
    env_file:
      - .env.production
    environment:
      # 🛑 በቀጥታ እሴቱን እዚህ በመስጠት ፕሪስማ ሁልጊዜ እንዲያገኘው እናደርጋለን
      DATABASE_URL: "postgresql://postgres:bruhtech123@db:5432/postgres?schema=public"
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: "http://localhost"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: hms-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  postgres_data: